name: image

# Publishes panaudia-server on a release tag of the server module:
#
#   git tag server/v0.3.0 && git push origin server/v0.3.0
#
# One multi-architecture image (linux/amd64 with static libxsmm,
# linux/arm64 on the gonum path) under ghcr.io/panaudia/panaudia-server
# tagged <version> and latest. The version baked into the binary is the
# same string. GHCR needs no secrets beyond the workflow token; to
# publish to Docker Hub as well, add a docker/login-action step with
# DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets and a second image name.
on:
  push:
    tags: ['server/v*']
  workflow_dispatch:
    inputs:
      version:
        description: "version to bake and tag (default: from the ref)"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: version
        id: v
        run: |
          v="${{ github.event.inputs.version }}"
          if [ -z "$v" ]; then
            ref="${GITHUB_REF_NAME}"
            case "$ref" in server/v*) v="${ref#server/v}" ;; *) v="0.0.0-g$(git rev-parse --short HEAD)" ;; esac
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/panaudia/panaudia-server:${{ steps.v.outputs.version }}
            ghcr.io/panaudia/panaudia-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
